mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml
materials:
  uo2: ../../../../materials/uo2_sigma_anchor.yaml
regime: 2D
solver_settings:
  coupling: staggered
  max_iters: 200
  relax_T: 0.9
  relax_u: 0.7
  relax_adaptive: true
  relax_growth: 1.1
  relax_shrink: 0.7
  relax_min: 0.05
  relax_max: 1.0
models:
  thermal: false
  mechanical: true
  damage: true
mechanical:
  solver: linear
  order: 1
  linear_solver: direct_mumps
  rtol: 1.0e-06
  stag_tol: 0.0001
  convergence: rel_norm
  debug: false
thermal:
  solver: linear
  linear_solver: iterative_hypre
  rtol: 1.0e-06
  stag_tol: 1.0e-06
  convergence: rel_norm
damage:
  type: AT1
  split: amor
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-06
  stag_tol: 0.0001
  convergence: rel_norm
  lc: 2.0e-06
  hybrid_constraint: true
n_steps: 21
time:
- 0.0
- 1.0
lhr:
- 0.0
- 0.0
output:
  format: vtu
  filename: simulation.vtu
