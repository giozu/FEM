# Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis
# Author: Giovanni Zullo
# Version: 0.3.2 (2026)
# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---
#
# Cohesive phase-field fracture: strength-surface test, plane strain.
# Vicentini et al., J. Mech. Phys. Solids 207 (2026) 106424, Sec. 5.3.
#
# The block is driven through a homogeneous strain state until the phase field
# first becomes non-zero; the stress at that instant is a point of the strength
# surface dS_0, which Eq. (110) gives in closed form. The loading angle in
# boundary_conditions.yaml selects which point.
#
# ell = 2.5e-5 m against ell_ch = 1.0e-4 m puts this case exactly at the
# strain-hardening limit ell = ell_ch / 4, as the paper's parameters intend.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  block: material.yaml

regime: 2d

solver_settings:
  max_iters: 500
  relax_u: 1.0

models:
  mechanical: true
  cohesive:
    ell: 2.5e-5          # regularization length (m)
    r_norm: "2"          # elliptic strength surface
    monitor: false
    # A uniformly stressed body would otherwise release every eigenstrain
    # degree of freedom in the same Newton step, leaving the system singular
    # (see CohesiveModel.cohesive_bounds). Confining the eigenstrain to one
    # column of cells leaves the rest at their bound to pin the displacement.
    # It does not bias the measurement: the stress is uniform, so the strength
    # surface is reached everywhere at the same instant regardless.
    eigenstrain_band: [0.0, 2.5e-5]

mechanical:
  solver: nonlinear
  rtol: 1.0e-8
  stag_tol: 1.0e-6
  convergence: rel_norm

lhr:
- 0.0
- 0.0
time:
- 0.0
- 56.0
n_steps: 56
